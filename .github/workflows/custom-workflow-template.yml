# Available GitHub context variables:
# - ${{ github.actor }}          - User who triggered the workflow
# - ${{ github.event_name }}     - Event that triggered the workflow
# - ${{ github.ref }}            - Branch or tag ref
# - ${{ github.repository }}     - Repository name
# - ${{ github.sha }}            - Commit SHA
# - ${{ github.workspace }}      - Workspace directory path
# - ${{ runner.os }}             - Operating system (Linux, Windows, macOS)
# - ${{ job.status }}            - Status of the current job
# - ${{ steps.<step-id>.outputs.<output-name> }} - Outputs from steps